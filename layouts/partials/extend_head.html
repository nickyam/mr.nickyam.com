     coherent zone instead of clashing styles. -->

.related-posts { margin-top: 2.5rem; border-top: 1px solid var(--border, #e8e8e8); padding-top: 1rem; }
.related-posts h2 { margin: 0 0 .6rem; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 0.8rem; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: #6b7280; }

.related-posts a { color: var(--primary, #2d7ff9); text-decoration: none; }
.related-posts a:hover { text-decoration: underline; }
</style>
